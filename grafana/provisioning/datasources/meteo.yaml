apiVersion: 1
datasources:
  - name: meteo
    uid: meteo-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: pg01:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: meteo
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 5
    secureJsonData:
      # Mot de passe lu dans l'environnement du service grafana-server (/etc/default/grafana-server), jamais dans Git.
      password: $__env{METEO_GRAFANA_PWD}
